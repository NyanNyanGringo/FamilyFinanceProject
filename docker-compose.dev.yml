# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  familyfinance-bot:
    environment:
      - DEV=false

  familyfinance-bot-dev:
    build: .
    container_name: familyfinance-bot-dev
    restart: "no"
    env_file:
      - .env
    environment:
      - DEV=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src:ro
      - ./lib:/app/lib:ro
      - ./run_server.py:/app/run_server.py:ro
      - ./config.py:/app/config.py:ro
      - ./.google_service_account_credentials.json:/app/.google_service_account_credentials.json:ro
      - ./voice_messages_dev:/app/voice_messages
