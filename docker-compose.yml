services:
  familyfinance-bot:
    build: .
    container_name: familyfinance-bot
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    env_file:
      - .env
    
    volumes:
      - ./.google_service_account_credentials.json:/app/.google_service_account_credentials.json:ro
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
